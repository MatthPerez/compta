name: compta

description: "Une application de gestion de comptabilité personnelle"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  flutter_typeahead: ^5.2.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  fl_chart: ^1.2.0
  csv: ^6.0.0
  flutter_colorpicker: ^1.1.0
  uuid: ^4.5.3
  barcode_widget: ^2.0.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - lib/assets/pics/cochon_finances.png
    - lib/assets/pics/compta_icon.png
    - lib/assets/pics/fidelity_card.png
    - lib/assets/pics/livre_finances.png
